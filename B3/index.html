<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3 - Sortable To Do / Done</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="lists">

        <div class="list">
            <h2>To Do</h2>

            <div class="items" id="todo">
                <div class="item" draggable="true">Task 1</div>
                <div class="item" draggable="true">Task 2</div>
                <div class="item" draggable="true">Task 3</div>
            </div>
        </div>


        <div class="list">
            <h2>Done</h2>

            <div class="items" id="done">
                <div class="item" draggable="true">Task 4</div>
                <div class="item" draggable="true">Task 5</div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
