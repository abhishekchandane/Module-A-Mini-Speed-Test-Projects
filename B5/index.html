<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B5 - Floor Plan Pathfinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="result" id="result">
        Select start room
    </div>

    <div class="floor-plan">

        <div class="room" id="A">A</div>
        <div class="room" id="B">B</div>
        <div class="room" id="C">C</div>
        <div class="room" id="D">D</div>
        <div class="room" id="E">E</div>
        <div class="room" id="F">F</div>
        <div class="room" id="G">G</div>
        <div class="room" id="H">H</div>

        <!-- Corridors -->
        <div class="line a-d"></div>
        <div class="line d-e"></div>
        <div class="line e-f"></div>
        <div class="line f-g"></div>
        <div class="line g-h"></div>
        <div class="line f-c"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
